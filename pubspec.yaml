name: tradeapp
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  
  # UI & Responsive
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  
  # State Management & Routing
  get: ^4.6.6
  
  # Components & Charts (Matches Dashboard HTML)
  fl_chart: ^0.65.0
  intl: ^0.19.0
  
  # Icons (To match Material Symbols)
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Asset structure organization
  assets:
    - assets/images/
    - assets/icons/
    - assets/svgs/